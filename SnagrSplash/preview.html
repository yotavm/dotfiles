<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snagr Dining — Splash Preview</title>
<style>
  :root { --brand:#121214; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:grid; place-items:center;
    background:#3a3a3c; font-family:Georgia, 'Times New Roman', serif;
  }
  .phone {
    width:300px; height:620px; border-radius:46px; background:#fafafa;
    position:relative; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 0 0 10px #111;
  }
  .statusbar {
    position:absolute; top:14px; left:0; right:0; display:flex;
    justify-content:space-between; padding:0 28px; font-size:13px;
    color:#111; font-family:-apple-system, system-ui, sans-serif; font-weight:600; z-index:50;
  }
  .stage {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:78px;
  }
  .plate { position:relative; width:200px; height:200px;
           display:grid; place-items:center; }

  /* soft shadow ellipse under the tile (the "counter") */
  .base {
    position:absolute; bottom:6px; width:150px; height:22px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(0,0,0,.16), rgba(0,0,0,0));
    opacity:0; animation:fadein .5s ease-out .55s forwards;
  }

  /* App-icon tile (revealed under the cloche) */
  .tile {
    position:absolute;
    width:130px; height:130px; border-radius:32px; background:#fff;
    display:grid; place-items:center;
    box-shadow:0 18px 30px rgba(0,0,0,.14);
    transform:scale(.4) translateY(10px); opacity:0;
    animation:rise .7s cubic-bezier(.2,1.35,.45,1) .55s forwards,
              breathe 2.4s ease-in-out 1.4s infinite alternate;
  }
  .tile .s { font-size:82px; font-weight:900; color:var(--brand); line-height:1; }

  /* Cloche (silver dome cover) sitting over the tile, then lifting away */
  .cloche {
    position:absolute; bottom:35px; z-index:30;
    width:150px; height:88px; border-radius:80px 80px 14px 14px / 78px 78px 14px 14px;
    background:linear-gradient(135deg,#f4f5f7 0%,#d7dade 38%,#b9bdc4 60%,#e9ebee 100%);
    box-shadow:0 10px 22px rgba(0,0,0,.18), inset 0 3px 6px rgba(255,255,255,.7);
    transform-origin:50% 100%;
    animation:lift 1s cubic-bezier(.4,0,.2,1) .55s forwards;
  }
  .cloche::before { /* knob on top */
    content:""; position:absolute; top:-13px; left:50%; width:20px; height:20px;
    transform:translateX(-50%); border-radius:50%;
    background:linear-gradient(135deg,#eef0f2,#c2c6cc);
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .cloche::after { /* highlight sheen */
    content:""; position:absolute; top:14px; left:24px; width:34px; height:46px;
    border-radius:50%; background:rgba(255,255,255,.45); filter:blur(4px);
  }

  /* Food burst — radial spray that pops on reveal then fades */
  .burst { position:absolute; top:50%; left:50%; font-size:26px; z-index:20;
           --tx:0px; --ty:0px; --rot:0deg;
           transform:translate(-50%,-50%) scale(0); opacity:0;
           animation:burst 1.1s cubic-bezier(.2,.9,.3,1) .95s forwards; }

  /* Steam wisps (loop) */
  .steam { position:absolute; top:-6px; left:50%; transform:translateX(-50%);
           display:flex; gap:13px; z-index:10; }
  .steam span {
    width:5px; height:46px; border-radius:5px;
    background:linear-gradient(to top, rgba(18,18,20,.30), rgba(18,18,20,0));
    opacity:0; animation:rise2 2.1s ease-out 1.2s infinite; }
  .steam span:nth-child(2){ animation-delay:1.55s; }
  .steam span:nth-child(3){ animation-delay:1.9s; }

  /* Wordmark */
  .word { text-align:center; opacity:0; transform:translateY(16px);
          animation:fadeup .6s ease-out 1.3s forwards; }
  .word .name { font-size:27px; font-weight:900; color:var(--brand); }
  .word .sub  { font-size:11px; letter-spacing:5px; font-weight:600;
                color:rgba(18,18,20,.55); font-family:-apple-system, system-ui, sans-serif; }

  .homebar { position:absolute; bottom:9px; left:50%; transform:translateX(-50%);
             width:120px; height:5px; border-radius:3px; background:#111; }

  @keyframes rise   { to { transform:scale(1) translateY(0); opacity:1; } }
  @keyframes lift {
    0%   { transform:translateY(0) scale(1); opacity:1; }
    35%  { transform:translateY(-6px) scale(1.02); opacity:1; }
    100% { transform:translateY(-230px) scale(.7); opacity:0; }
  }
  @keyframes burst {
    0%   { transform:translate(-50%,-50%) scale(0)   rotate(0); opacity:0; }
    18%  { opacity:1; }
    55%  { transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1.15) rotate(var(--rot)); opacity:1; }
    100% { transform:translate(calc(-50% + var(--tx)*1.25),calc(-50% + var(--ty)*1.25 - 18px)) scale(.5) rotate(var(--rot)); opacity:0; }
  }
  @keyframes fadeup { to { transform:translateY(0); opacity:1; } }
  @keyframes fadein { to { opacity:1; } }
  @keyframes breathe{ from { transform:scale(1) translateY(4px);} to { transform:scale(1) translateY(-5px);} }
  @keyframes rise2 {
    0%   { opacity:0; transform:translateY(0)   scaleY(.6); }
    18%  { opacity:.85; }
    100% { opacity:0; transform:translateY(-30px) scaleY(1.1); }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"><span>4:01</span><span>5G ▣</span></div>
    <div class="stage">
      <div class="plate">
        <div class="base"></div>
        <div class="steam"><span></span><span></span><span></span></div>
        <div class="tile"><div class="s">S</div></div>

        <div class="burst" style="--tx:-86px;--ty:-30px;--rot:-25deg;">🍣</div>
        <div class="burst" style="--tx:-58px;--ty:-78px;--rot:18deg;">🍤</div>
        <div class="burst" style="--tx:0px;  --ty:-96px;--rot:-12deg;">🍜</div>
        <div class="burst" style="--tx:58px; --ty:-78px;--rot:20deg;">🥗</div>
        <div class="burst" style="--tx:86px; --ty:-30px;--rot:-18deg;">🍔</div>
        <div class="burst" style="--tx:-70px;--ty:24px; --rot:14deg;">🍩</div>
        <div class="burst" style="--tx:70px; --ty:24px; --rot:-22deg;">🍕</div>

        <div class="cloche"></div>
      </div>
      <div class="word">
        <div class="name">Snagr</div>
        <div class="sub">DINING</div>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</body>
</html>
